<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCamp Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body><main class="quiz-container">
 
    <section class="welcome-screen">

        <div class="code-logo">
            <span>&lt;</span>/<span>&gt;</span>
        </div>

        <h1>CodeCamp</h1>

        <p>
            Test your knowledge
            with this comprehensive quiz!
        </p>

        <button class="start-button">Start Quiz</button>

    </section>


    
    <section class="quiz-screen hidden">

        <div class="quiz-header">

            <h3>🟢 Space Quiz</h3>

            <span class="score">
                SCORE: 0/5
            </span>

        </div>
     
        <div class="question-area">

          
          
            <div class="options-container">
          

            </div> 

        </div> 

        <div class="quiz-footer">

            <span class="question-number">1/5</span>

            <button class="next-button">Next →</button>

        </div>

    </section>


    
    <section class="result-screen hidden">

        <h2>Quiz Completed!</h2>

        <p>Your Final Score</p>

        <h1 class="final-score">01 / 05</h1>

        <button class="restart-button">Play Again</button>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
